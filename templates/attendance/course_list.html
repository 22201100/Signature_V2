{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between mb-2">
  <h4>Courses</h4>
  <a class="btn btn-success" href="/attendance/courses/new/">Add Course</a>
</div>
<div class="card shadow-sm"><div class="card-body">
<table class="table">
  <thead><tr><th>Code</th><th>Title</th><th>Lecturer</th><th></th></tr></thead>
  <tbody>{% for c in items %}
    <tr><td>{{ c.code }}</td><td>{{ c.title }}</td><td>{{ c.lecturer }}</td>
      <td class="text-end">
        <a class="btn btn-sm btn-outline-primary" href="/attendance/courses/{{c.id}}/edit/">Edit</a>
        <a class="btn btn-sm btn-outline-danger" href="/attendance/courses/{{c.id}}/delete/">Delete</a>
      </td></tr>
  {% empty %}<tr><td colspan="4">No courses</td></tr>{% endfor %}</tbody>
</table>
</div></div>
{% endblock %}
