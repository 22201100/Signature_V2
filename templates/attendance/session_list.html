{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between mb-2">
  <h4>Sessions</h4>
  <a class="btn btn-warning" href="/attendance/sessions/new/">Create Session</a>
</div>
<div class="card shadow-sm"><div class="card-body">
<table class="table">
  <thead><tr><th>Course</th><th>Date</th><th>Time</th><th>Open</th><th></th></tr></thead>
  <tbody>{% for s in items %}
    <tr>
      <td>{{ s.course.code }}</td><td>{{ s.date }}</td><td>{{ s.start_time }}–{{ s.end_time }}</td><td>{{ s.is_open }}</td>
      <td class="text-end">
        <a class="btn btn-sm btn-outline-primary" href="/attendance/records/{{ s.id }}/">Open</a>
        <a class="btn btn-sm btn-outline-secondary" href="/attendance/sessions/{{s.id}}/edit/">Edit</a>
        <a class="btn btn-sm btn-outline-danger" href="/attendance/sessions/{{s.id}}/delete/">Delete</a>
      </td>
    </tr>
  {% empty %}<tr><td colspan="5">No sessions</td></tr>{% endfor %}</tbody>
</table>
</div></div>
{% endblock %}
