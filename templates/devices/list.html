{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between mb-2">
  <h4>Devices</h4>
  <div>
    <a class="btn btn-info" href="/devices/connect/">Connect Device</a>
    <a class="btn btn-success" href="/devices/new/">Add Device</a>
  </div>
</div>
<div class="card shadow-sm"><div class="card-body">
<table class="table">
  <thead><tr><th>Name</th><th>Module</th><th>RDM</th><th>Status</th><th>Last Seen</th><th></th></tr></thead>
  <tbody>{% for d in items %}
    <tr>
      <td>{{ d.name }}</td><td>{{ d.module }}</td><td>{{ d.rdm_model }}</td><td>{{ d.status }}</td><td>{{ d.last_seen }}</td>
      <td class="text-end">
        <a class="btn btn-sm btn-outline-primary" href="/devices/logs/{{ d.id }}/">Logs</a>
        <a class="btn btn-sm btn-outline-secondary" href="/devices/{{ d.id }}/edit/">Edit</a>
        <a class="btn btn-sm btn-outline-danger" href="/devices/{{ d.id }}/delete/">Delete</a>
      </td>
    </tr>
  {% empty %}<tr><td colspan="6">No devices</td></tr>{% endfor %}</tbody>
</table>
</div></div>
{% endblock %}
