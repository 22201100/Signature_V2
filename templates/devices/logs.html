{% extends 'base.html' %}
{% block content %}
<h4>{{ device.name }} - Logs</h4>
<div class="card shadow-sm"><div class="card-body">
<table class="table table-sm">
  <thead><tr><th>Time</th><th>Template</th><th>Result</th><th>Note</th></tr></thead>
  <tbody>{% for l in logs %}<tr><td>{{ l.timestamp }}</td><td>{{ l.template_id }}</td><td>{{ l.result }}</td><td>{{ l.note }}</td></tr>{% empty %}<tr><td colspan="4">No logs</td></tr>{% endfor %}</tbody>
</table>
</div></div>
{% endblock %}
